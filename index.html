
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>gmshelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --surface: #f7f7f7;
      --border: #e9e9e9;
      --text: #171717;
      --muted: #858585;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      font-size: 13px;
    }

    button, input { font: inherit; }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
    }

    button:hover { background: var(--surface); }

    .topbar {
      height: 62px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 5;
    }

    .brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aaa;
    }

    .dot.online { background: #222; }
    .dot.offline { background: #c44; }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 38px 28px 70px;
    }

    .heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 25px;
      letter-spacing: -1.2px;
      margin: 0 0 7px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .search-wrap i {
      position: absolute;
      left: 13px;
      top: 13px;
      color: var(--muted);
      width: 15px;
      height: 15px;
    }

    #search {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      padding: 0 14px 0 38px;
      background: #fff;
      color: var(--text);
    }

    #search:focus { border-color: #999; }

    .meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 16px;
    }

    .game {
      min-width: 0;
      cursor: pointer;
    }

    .cover {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 10px;
      object-fit: cover;
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .game-name {
      font-weight: 600;
      margin-top: 9px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-source {
      color: var(--muted);
      font-size: 10px;
      margin-top: 4px;
      text-transform: lowercase;
    }

    .empty {
      padding: 35px 15px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      margin-top: 12px;
    }

    #gameError {
      color: #a33;
      border-color: #e6caca;
      background: #fffafa;
      white-space: pre-wrap;
      text-align: left;
      overflow-wrap: anywhere;
    }

    [hidden] { display: none !important; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: #0007;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 15px 60px #0002;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-head strong { font-size: 15px; }

    .modal p {
      color: var(--muted);
      line-height: 1.6;
    }

    #summaryText {
      white-space: pre-wrap;
      line-height: 1.7;
      color: var(--text);
    }

    .modal-close {
      border: 0;
      padding: 5px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .topbar { padding: 0 16px; }
      main { padding: 28px 16px 50px; }
      .heading { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">gmshelf</div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">connecting to api</span>
    </div>
  </header>

  <main>
    <div class="heading">
      <div>
        <h1>game library</h1>
        <div class="subtitle">a collection of browser games in one serverless api.</div>
      </div>
      <div class="actions">
        <button id="refreshButton"><i data-lucide="refresh-cw"></i> refresh</button>
      </div>
    </div>

    <div class="search-wrap">
      <i data-lucide="search"></i>
      <input id="search" type="search" placeholder="search games..." autocomplete="off">
    </div>

    <div class="meta">
      <span id="gameCount">loading games...</span>
      <span id="apiVersion">gmshelf api</span>
    </div>

    <div class="grid" id="gameGrid"></div>
    <div class="empty" id="emptyState" hidden>no games found.</div>
    <div class="empty" id="loadingState">loading games...</div>
    <div class="empty" id="gameError" hidden></div>
  </main>

  <div class="modal-backdrop" id="summaryModal">
    <div class="modal">
      <div class="modal-head">
        <strong id="summaryTitle">game summary</strong>
        <button class="modal-close" id="closeModal" aria-label="close">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="summaryText">generating summary...</div>
    </div>
  </div>

  <script>
    const API = "https://gmshelf-api.workers.dev";

    const grid = document.getElementById("gameGrid");
    const searchInput = document.getElementById("search");
    const countText = document.getElementById("gameCount");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const loadingState = document.getElementById("loadingState");
    const emptyState = document.getElementById("emptyState");
    const gameError = document.getElementById("gameError");

    let games = [];
    let filteredGames = [];
    let apiOnline = false;

    function refreshIcons() {
      if (window.lucide) {
        try { lucide.createIcons(); } catch (error) {
          console.warn("icon rendering failed:", error);
        }
      }
    }

    function setStatus(online, message) {
      apiOnline = online;
      statusDot.className = "dot " + (online ? "online" : "offline");
      statusText.textContent = message;
    }

    function setError(message) {
      gameError.hidden = !message;
      gameError.textContent = message || "";
    }

    async function request(path, options = {}) {
      const response = await fetch(API + path, {
        ...options,
        headers: {
          "Accept": "application/json",
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("api returned invalid json (" + response.status + ").");
      }

      if (!response.ok) {
        throw new Error(data.error || data.message || "request failed (" + response.status + ").");
      }

      return data;
    }

    async function checkHealth() {
      try {
        const data = await request("/api/health");

        if (data.ok !== true) {
          throw new Error(data.error || "api health check failed.");
        }

        setStatus(true, "api connected");

        if (data.version) {
          document.getElementById("apiVersion").textContent =
            "api v" + data.version;
        }

        return true;
      } catch (error) {
        setStatus(false, "api unavailable");
        console.error("health check failed:", error);
        return false;
      }
    }

    function coverFallback(name) {
      return API + "/api/cover?name=" + encodeURIComponent(name || "game");
    }

    function createGameCard(game) {
      const card = document.createElement("article");
      card.className = "game";

      const image = document.createElement("img");
      image.className = "cover";
      image.loading = "lazy";
      image.alt = game.name || "game cover";
      image.src = game.cover || coverFallback(game.name);

      image.onerror = () => {
        image.onerror = null;
        image.src = coverFallback(game.name);
      };

      const name = document.createElement("div");
      name.className = "game-name";
      name.textContent = game.name || "untitled game";

      const source = document.createElement("div");
      source.className = "game-source";
      source.textContent = game.source || "game";

      card.append(image, name, source);

      card.addEventListener("click", () => {
        if (game.url) {
          window.open(game.url, "_blank", "noopener,noreferrer");
        }
      });

      return card;
    }

    function renderGames() {
      grid.replaceChildren();

      const list = filteredGames;

      for (const game of list) {
        grid.appendChild(createGameCard(game));
      }

      countText.textContent =
        list.length + " games" +
        (list.length !== games.length ? " shown" : " available");

      emptyState.hidden = list.length !== 0;
      refreshIcons();
    }

    async function loadGames() {
      loadingState.hidden = false;
      loadingState.textContent = "loading games...";
      emptyState.hidden = true;
      setError("");

      try {
        const data = await request("/api/games?limit=1000");

        if (!Array.isArray(data.games)) {
          throw new Error("api response did not contain a games array.");
        }

        games = data.games;
        filteredGames = [...games];

        loadingState.hidden = true;
        renderGames();

        if (Array.isArray(data.errors) && data.errors.length) {
          setError(
            "some game sources could not load:\n" +
            data.errors.map(error =>
              typeof error === "string"
                ? error
                : JSON.stringify(error)
            ).join("\n")
          );
        }

        console.log("gmshelf games loaded:", data);
      } catch (error) {
        loadingState.hidden = true;
        countText.textContent = "unable to load games";
        setError("could not load games:\n" + error.message);
        console.error("game loading failed:", error);
      }
    }

    function searchGames() {
      const query = searchInput.value.trim().toLowerCase();

      filteredGames = games.filter(game => {
        const name = (game.name || "").toLowerCase();
        const source = (game.source || "").toLowerCase();
        return name.includes(query) || source.includes(query);
      });

      renderGames();
    }

    async function showSummary(game) {
      const modal = document.getElementById("summaryModal");
      const title = document.getElementById("summaryTitle");
      const output = document.getElementById("summaryText");

      title.textContent = game.name || "game summary";
      output.textContent = "generating summary...";
      modal.classList.add("open");
      refreshIcons();

      try {
        const data = await request("/api/summary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: game.name,
            url: game.url,
            source: game.source
          })
        });

        if (!data.ok) {
          throw new Error(data.error || "summary generation failed.");
        }

        output.textContent = String(
          data.summary || data.text || "no summary available."
        ).toLowerCase();
      } catch (error) {
        output.textContent = "could not generate summary: " + error.message;
      }
    }

    document.getElementById("closeModal").addEventListener("click", () => {
      document.getElementById("summaryModal").classList.remove("open");
    });

    document.getElementById("summaryModal").addEventListener("click", event => {
      if (event.target.id === "summaryModal") {
        event.currentTarget.classList.remove("open");
      }
    });

    document.getElementById("refreshButton").addEventListener("click", async () => {
      await checkHealth();
      await loadGames();
    });

    searchInput.addEventListener("input", searchGames);

    async function init() {
      refreshIcons();
      await checkHealth();
      await loadGames();

      setInterval(checkHealth, 30000);
    }

    init();
  </script>
</body>
</html>
